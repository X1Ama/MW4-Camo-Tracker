# Push a tag like v0.2.0 and GitHub builds every download and publishes the release for you.
#   git tag v0.2.0
#   git push origin v0.2.0
#
# Only the Windows app (the WPF app in the repository root) is released for now.
# The Linux, macOS and Android builds (the Avalonia app in cross/) are paused: the code is still in cross/, and the
# jobs can be brought back from the git history (see the commit that paused them).
# To force everyone to update, edit update.json on the release and set "required": true.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Work out the version from the tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        shell: pwsh
        run: |
          (Get-Content MasteryTracker.csproj -Raw) -replace '<Version>[^<]*</Version>', "<Version>$env:VERSION</Version>" |
            Set-Content MasteryTracker.csproj -Encoding UTF8
          dotnet publish MasteryTracker.csproj -c Release -r win-x64 -o out

      - uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: out/MasteryCamoTracker.exe

  release:
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write update.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${{ github.repository }}/releases/latest/download"
          # the patch notes shown on the update screen come from patchnotes.txt (one "- " line per change)
          notes='[]'
          if [ -f patchnotes.txt ]; then
            notes=$(grep -E '^\s*[-*]\s+\S' patchnotes.txt | sed -E 's/^\s*[-*]\s+//; s/\r$//' | jq -R . | jq -s .)
          fi
          assets='{}'
          jq -n --arg version "$VERSION" --arg url "$BASE/MasteryCamoTracker.exe" \
                --argjson notes "$notes" --argjson assets "$assets" \
                '{version: $version, url: $url, notes: $notes, required: false, assets: $assets}' > artifacts/update.json
          cat artifacts/update.json
          ls -la artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
